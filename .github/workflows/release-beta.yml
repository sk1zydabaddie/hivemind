name: Publish verified unsigned Windows beta

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hivemind-unsigned-beta-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    environment: beta-release
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HIVEMIND_PUBLIC_RELEASE_APPROVED: "true"
      HIVEMIND_RELEASE_TIER: "unsigned-beta"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix desktop
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Load protected beta updater identity
        shell: pwsh
        env:
          HIVEMIND_UPDATER_PUBLIC_KEY: ${{ vars.HIVEMIND_UPDATER_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:HIVEMIND_UPDATER_PUBLIC_KEY)) { throw 'protected beta updater public key is unavailable' }
          $policy = Get-Content -LiteralPath 'desktop/release/unsigned-beta-policy.json' -Raw | ConvertFrom-Json
          $policy.updater_public_key = $env:HIVEMIND_UPDATER_PUBLIC_KEY
          $policyPath = Join-Path $env:RUNNER_TEMP 'hivemind-unsigned-beta-trust-policy.json'
          $policy | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $policyPath -Encoding utf8NoBOM
          "HIVEMIND_RELEASE_TRUST_POLICY=$policyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, install, verify draft, and publish the updater-signed beta
        working-directory: desktop
        run: npm run release:github:beta

      - name: Remove ephemeral beta policy
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'hivemind-unsigned-beta-trust-policy.json') -Force -ErrorAction SilentlyContinue
